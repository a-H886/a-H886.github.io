<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恒 · 个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #05070f;
      color: #e6ecff;
      overflow-x: hidden;
    }

    /* ===== 弹窗遮罩 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 15, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-box {
      background: linear-gradient(145deg, #0d1428, #131f3d);
      border: 1px solid rgba(0, 200, 255, 0.35);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.25);
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .modal-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-box p {
      font-size: 20px;
      color: #ffd6e8;
      margin-bottom: 28px;
    }

    .modal-box .heart { color: #ff4d8d; }

    .close-btn {
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      color: #05070f;
      border: none;
      padding: 12px 36px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .close-btn:hover { transform: scale(1.05); }

    /* ===== 封面 ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(5, 7, 15, 0.55), rgba(5, 7, 15, 0.85)),
        url('https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=1600&q=80') center/cover no-repeat;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 72px;
      letter-spacing: 12px;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 20px;
      color: #d6e4ff;
      max-width: 520px;
      line-height: 1.8;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* ===== 内容版块 ===== */
    .section {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    .section h2 {
      font-size: 36px;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section p {
      font-size: 18px;
      color: #9fb4d8;
      line-height: 1.9;
      max-width: 640px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: linear-gradient(145deg, #0d1428, #131f3d);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 16px;
      padding: 28px 20px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00e5ff;
    }

    .card p {
      font-size: 15px;
      color: #9fb4d8;
    }

    .footer {
      text-align: center;
      padding: 40px 20px;
      color: #5a6b8c;
      font-size: 14px;
      border-top: 1px solid rgba(0, 200, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- 进入弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h1>欢迎进入</h1>
      <p>欣悦喜欢小语 <span class="heart">❤️</span></p>
      <button class="close-btn" onclick="closeModal()">进入主页</button>
    </div>
  </div>

  <!-- 封面 -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1>恒</h1>
      <p>这里是我的个人主页。<br>欣悦喜欢小语，其他由你自由发挥。</p>
    </div>
  </section>

  <!-- 关于 -->
  <section class="section">
    <h2>关于我</h2>
    <p>这里是关于"恒"的介绍。欣悦喜欢小语，愿每一天都充满热爱与期待。</p>
  </section>

  <!-- 特色 -->
  <section class="section">
    <h2>我的世界</h2>
    <div class="cards">
      <div class="card">
        <h3>欣悦</h3>
        <p>温暖与喜悦，是生活里最亮的光。</p>
      </div>
      <div class="card">
        <h3>小语</h3>
        <p>那些细碎而珍贵的小语，都值得被记住。</p>
      </div>
      <div class="card">
        <h3>❤️</h3>
        <p>喜欢，是最简单也最美好的事。</p>
      </div>
    </div>
  </section>

  <div class="footer">恒 · 个人主页</div>

  <script>
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
